name: ark-first-app

services:
  web:
    image: docker.io/library/python:3.12-alpine
    user: "65534:65534"
    working_dir: /app
    command: ["python", "-u", "app.py"]
    environment:
      MESSAGE: "Hello from ARK"
    volumes:
      - ./app.py:/app/app.py:ro
    ports:
      - "127.0.0.1:8080:8000"
