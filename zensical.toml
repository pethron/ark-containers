      { "Image content and layers" = "03-images-and-registries/02-image-content-and-layers.md" },
      { "Digests and manifests" = "03-images-and-registries/03-digests-manifests-and-multi-arch-images.md" },
      { "Run a local registry" = "03-images-and-registries/04-run-a-local-registry.md" },
      { "Registry contracts and authentication" = "03-images-and-registries/05-registry-contract-and-authentication.md" },
      { "Platforms and compatibility" = "03-images-and-registries/06-platforms-and-compatibility.md" },
      { "Kata: artifact handover" = "03-images-and-registries/katas/README.md" },
    ] },
    { "04: Building images (in preparation)" = "04-building-images/README.md" },
    { "05: Storage (in preparation)" = "05-storage/README.md" },
    { "06: Networking (in preparation)" = "06-networking/README.md" },
    { "07: Compose (in preparation)" = "07-compose/README.md" },
    { "08: Security (in preparation)" = "08-security/README.md" },
    { "09: Production and troubleshooting (in preparation)" = "09-production-and-troubleshooting/README.md" },
  ] },
  { "Under the hood (optional)" = [
    { "About these deep dives" = "advanced/README.md" },
    { "Linux primitives" = [
      { "Overview" = "advanced/linux-primitives/README.md" },
      { "A container is just a process" = "advanced/linux-primitives/01-a-container-is-just-a-process.md" },
      { "Namespaces" = "advanced/linux-primitives/02-namespaces.md" },
      { "cgroups v2" = "advanced/linux-primitives/03-cgroups-v2.md" },
      { "Capabilities, seccomp and LSMs" = "advanced/linux-primitives/04-capabilities-seccomp-and-lsms.md" },
      { "Root filesystems" = "advanced/linux-primitives/05-root-filesystems-chroot-and-pivot-root.md" },
      { "Inspecting boundaries" = "advanced/linux-primitives/06-inspecting-namespaces-and-cgroups.md" },
      { "Katas: review and manual sandbox" = "advanced/linux-primitives/katas/README.md" },
    ] },
    { "Runtime architecture" = [
      { "Overview" = "advanced/runtime-architecture/README.md" },
      { "The Docker engine" = "advanced/runtime-architecture/01-the-docker-engine.md" },
      { "containerd and the shim" = "advanced/runtime-architecture/02-containerd-and-the-shim.md" },
