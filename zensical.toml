[project.theme]
language = "en"
features = ["navigation.footer", "content.code.copy", "content.tabs.link"]
font = false

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.highlight" = {}
"pymdownx.tabbed" = { alternate_style = true }

[project.markdown_extensions.toc]
permalink = true
