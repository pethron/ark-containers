      { "Installation" = "01-why-containers/02-installing-docker.md" },
      { "Your first application" = "01-why-containers/03-your-first-application.md" },
      { "Physical servers and virtual machines" = "01-why-containers/04-from-physical-servers-to-virtual-machines.md" },
      { "A short history of isolation" = "01-why-containers/05-a-short-history-of-isolation-chroot-to-oci.md" },
      { "Virtual machines vs containers" = "01-why-containers/06-virtual-machines-vs-containers.md" },
      { "Example files" = "01-why-containers/first-app/README.md" },
      { "Kata: a service handover" = "01-why-containers/katas/README.md" },
    ] },
    { "02: Running containers" = [
      { "Overview" = "02-running-containers/README.md" },
      { "Observe a running service" = "02-running-containers/01-observe-a-running-service.md" },
      { "Lifecycle and states" = "02-running-containers/02-container-lifecycle-and-states.md" },
      { "Configure and replace" = "02-running-containers/03-configure-and-replace.md" },
      { "Stopping a service" = "02-running-containers/04-pid-1-and-signals.md" },
      { "Limits and restart policies" = "02-running-containers/05-limits-and-restart-policies.md" },
      { "Resource usage and failure" = "02-running-containers/06-resource-usage-and-failure.md" },
      { "Supplied service" = "02-running-containers/service/README.md" },
      { "Kata: next-shift handover" = "02-running-containers/katas/README.md" },
    ] },
    { "03: Images and registries" = [
      { "Overview" = "03-images-and-registries/README.md" },
