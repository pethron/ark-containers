      { "OCI images and distribution" = "advanced/runtime-architecture/04-oci-image-and-distribution-specs.md" },
      { "CRI and the ecosystem" = "advanced/runtime-architecture/05-cri-and-the-wider-ecosystem.md" },
      { "Optional: direct containerd clients" = "advanced/runtime-architecture/06-docker-nerdctl-and-ctr-side-by-side.md" },
      { "Kata: runtime diagnosis" = "advanced/runtime-architecture/katas/README.md" },
    ] },
  ] },
]

[project.theme]
language = "en"
features = ["navigation.footer", "content.code.copy", "content.tabs.link"]
font = false

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
"pymdownx.details" = {}
"pymdownx.superfences" = {}
"pymdownx.highlight" = {}
"pymdownx.tabbed" = { alternate_style = true }

[project.markdown_extensions.toc]
permalink = true
