<svg xmlns="http://www.w3.org/2000/svg" width="736.5" height="318" viewBox="0 0 736.5 318" role="img" aria-labelledby="title description">
<title id="title">Dependency installation after a source edit</title>
<desc id="description">[Baseline after an application-only edit]
$ docker build --progress=plain -f Dockerfile.baseline -t ark-template:baseline .
#9 [5/5] RUN pip install --no-cache-dir --only-binary=:all: -r requirements.txt
#9 3.606 Successfully installed Jinja2-3.1.6 MarkupSafe-3.0.4
#9 DONE 3.9s

[Dependency-first recipe after the same edit]
$ docker build --progress=plain -t ark-template:cached .
#9 [5/6] RUN pip install --no-cache-dir --only-binary=:all: -r requirements.txt
#9 CACHED</desc>
<rect width="736.5" height="318" rx="12" fill="#0c1220"/>
<path d="M0 44H736.5" stroke="#334155"/>
