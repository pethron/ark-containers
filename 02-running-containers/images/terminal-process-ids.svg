<svg xmlns="http://www.w3.org/2000/svg" width="700" height="406" viewBox="0 0 700 406" role="img" aria-labelledby="title description">
<title id="title">One server process, two PID numbers</title>
<desc id="description">[Inside the container]
$ docker exec ark-ops ps
PID   USER     TIME  COMMAND
    1 ark       0:00 python /app/app.py
    8 ark       0:00 ps

[From the host]
$ docker top ark-ops -o pid,args
PID                 COMMAND
4056                python /app/app.py

[The host PID Docker recorded]
$ docker inspect --format &apos;{{.State.Pid}}&apos; ark-ops
4056</desc>
<rect width="700" height="406" rx="12" fill="#0c1220"/>
<path d="M0 44H700" stroke="#334155"/>
<text x="24" y="28" fill="#cbd5e1" font-family="Consolas,monospace" font-size="15">One server process, two PID numbers</text>
<text x="24" y="70" fill="#94a3b8" font-family="Consolas,monospace" font-size="14" xml:space="preserve">Inside the container</text>
<text x="24" y="92" fill="#5eead4" font-family="Consolas,monospace" font-size="14" xml:space="preserve">$ docker exec ark-ops ps</text>
<text x="24" y="114" fill="#dbe4ee" font-family="Consolas,monospace" font-size="14" xml:space="preserve">PID   USER     TIME  COMMAND</text>
<text x="24" y="136" fill="#dbe4ee" font-family="Consolas,monospace" font-size="14" xml:space="preserve">    1 ark       0:00 python /app/app.py</text>
<text x="24" y="158" fill="#dbe4ee" font-family="Consolas,monospace" font-size="14" xml:space="preserve">    8 ark       0:00 ps</text>
<text x="24" y="180" fill="#dbe4ee" font-family="Consolas,monospace" font-size="14" xml:space="preserve"> </text>
<text x="24" y="202" fill="#94a3b8" font-family="Consolas,monospace" font-size="14" xml:space="preserve">From the host</text>
<text x="24" y="224" fill="#5eead4" font-family="Consolas,monospace" font-size="14" xml:space="preserve">$ docker top ark-ops -o pid,args</text>
<text x="24" y="246" fill="#dbe4ee" font-family="Consolas,monospace" font-size="14" xml:space="preserve">PID                 COMMAND</text>
<text x="24" y="268" fill="#dbe4ee" font-family="Consolas,monospace" font-size="14" xml:space="preserve">4056                python /app/app.py</text>
<text x="24" y="290" fill="#dbe4ee" font-family="Consolas,monospace" font-size="14" xml:space="preserve"> </text>
<text x="24" y="312" fill="#94a3b8" font-family="Consolas,monospace" font-size="14" xml:space="preserve">The host PID Docker recorded</text>
<text x="24" y="334" fill="#5eead4" font-family="Consolas,monospace" font-size="14" xml:space="preserve">$ docker inspect --format &apos;{{.State.Pid}}&apos; ark-ops</text>
<text x="24" y="356" fill="#dbe4ee" font-family="Consolas,monospace" font-size="14" xml:space="preserve">4056</text>
<text x="24" y="391" fill="#94a3b8" font-family="Consolas,monospace" font-size="12">2026-10-31 | Docker 29.6.1 | IDs and times may differ</text>
</svg>
