<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340" role="img" aria-labelledby="title description">
<title id="title">Restart and replacement: actual container IDs</title>
<desc id="description">[Before restart]
$ docker inspect --format &apos;{{.Id}}&apos; ark-ops
ca0d019b33a1a259a010451f17657827b8dd4ea28e5629ecba842b270e15be9a

[After restart]
$ docker inspect --format &apos;{{.Id}}&apos; ark-ops
ca0d019b33a1a259a010451f17657827b8dd4ea28e5629ecba842b270e15be9a

[After stop, remove and replacement]
$ docker inspect --format &apos;{{.Id}}&apos; ark-ops
70e23db063b1fa283e9e986d797977dc55df5ad267ce8413614702f5954749b2</desc>
