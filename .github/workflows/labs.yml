name: Check labs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Show Docker versions
        run: |
          docker version
          docker compose version
      - name: Run unit tests and container checks
        run: python scripts/check_labs.py
      - name: Check the advanced Compose application workflow
        run: python scripts/check_compose_workflows.py
