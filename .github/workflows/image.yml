name: Publish course image

# Publishes the message service learners run from module 01, built from the
# same recipe they build themselves in module 04. Push a tag such as
# ark-message-v1.0.0 to publish 1.0.0, 1.0 and 1.
on:
  push:
    tags: ["ark-message-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ark-message
          tags: |
            type=match,pattern=ark-message-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=ark-message-v(\d+\.\d+)\.\d+,group=1
            type=match,pattern=ark-message-v(\d+)\.\d+\.\d+,group=1
          labels: |
            org.opencontainers.image.title=ark-message
            org.opencontainers.image.description=The message service from the ARK Containers course
      - uses: docker/build-push-action@v7
        with:
          context: 04-building-images/message-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
